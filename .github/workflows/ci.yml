name: Daily build & deploy
on:
  schedule:
    - cron: '17 3 * * *'        # 每天 03:17 UTC（北京时间 11:17）自动重建
  workflow_dispatch:            # 支持手动触发
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'index.html'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh Top data snapshot (daily stars)
        shell: pwsh
        run: |
          curl -fsSL https://raw.githubusercontent.com/xiaohai-78/Top/main/data.json -o tools/top-data.json
          echo "top-data.json: $((Get-Item tools/top-data.json).Length) bytes"

      - name: Discover community plugins (dsh-plugin topic)
        shell: pwsh
        continue-on-error: true   # 网络/限流失败时保留上次 community-plugins.json
        run: ./tools/discover-dsh-plugins.ps1

      - name: Build site data
        shell: pwsh
        run: ./tools/build-site-data.ps1

      - name: Build index.html
        shell: pwsh
        run: ./tools/build-site.ps1

      - name: Smoke test
        shell: pwsh
        run: node tools/smoke.js

      - name: Commit rebuilt artifacts
        run: |
          git config user.name "dsh-plugins-bot"
          git config user.email "bot@dsh-plugins.top"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: rebuild site data ($(date -u +%F))"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
